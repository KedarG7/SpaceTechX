services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: ndrf-postgis
    environment:
      POSTGRES_USER: ndrf
      POSTGRES_PASSWORD: ndrf
      POSTGRES_DB: ndrf
    ports:
      - "5432:5432"
    volumes:
      - ndrf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndrf -d ndrf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ndrf_pgdata:
